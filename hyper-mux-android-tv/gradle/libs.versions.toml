[versions]
agp = "8.7.3"
kotlin = "2.0.21"
ksp = "2.0.21-1.0.27"
hilt = "2.52"
hiltNavigation = "1.2.0"

coreKtx = "1.15.0"
lifecycle = "2.8.7"
activityCompose = "1.9.3"

composeBom = "2024.12.01"
navigation = "2.8.4"
datastore = "1.1.1"
# AndroidX TV：TvLazyRow/TvLazyColumn/TvLazyVerticalGrid（焦点项自动滚入可视区 + pivot 居中，TV rail 必需）。
# 版本必须锁 **alpha11**：alpha12 / 1.0.0 稳定版已把 lazy list/grid 整包移除（只剩 text 包，
# 基线迁到 Compose 1.8+），与 composeBom=2024.12.01（1.7.6）不再配套。alpha11 的 compose 基线正是 1.7.6。
# 见 48-tv-app-detailed.md §14 风险项「tv-foundation 版本」。切勿单独升级此项。
tvFoundation = "1.0.0-alpha11"

media3 = "1.7.1"
# NextLib 社区预编译的 Media3 FFmpeg 解码扩展（官方 media3-decoder-ffmpeg 未发布到 Maven）。
# 版本号规则 = <media3 版本>-<nextlib 版本>，这里的 1.7.1 前缀即表示「面向 Media3 1.7.1 构建」，
# 其 POM 的依赖也正好是 androidx.media3:media3-exoplayer:1.7.1，因此与上面的 media3 严格对齐，
# 无需改动任何 media3 版本；切勿单独升级其一，否则会 duplicate class / NoSuchMethod。
nextlib = "1.7.1-0.9.0"
retrofit = "2.11.0"
okhttp = "4.12.0"
coil = "3.1.0"
coroutines = "1.9.0"
# 扫码登录：TV 端只做二维码编码（手机端负责解码），core 足够
zxing = "3.5.3"

[libraries]
androidx-core-ktx = { group = "androidx.core", name = "core-ktx", version.ref = "coreKtx" }
androidx-lifecycle-runtime-ktx = { group = "androidx.lifecycle", name = "lifecycle-runtime-ktx", version.ref = "lifecycle" }
androidx-lifecycle-viewmodel-compose = { group = "androidx.lifecycle", name = "lifecycle-viewmodel-compose", version.ref = "lifecycle" }
androidx-activity-compose = { group = "androidx.activity", name = "activity-compose", version.ref = "activityCompose" }

androidx-compose-bom = { group = "androidx.compose", name = "compose-bom", version.ref = "composeBom" }
androidx-ui = { group = "androidx.compose.ui", name = "ui" }
androidx-ui-graphics = { group = "androidx.compose.ui", name = "ui-graphics" }
androidx-ui-tooling = { group = "androidx.compose.ui", name = "ui-tooling" }
androidx-ui-tooling-preview = { group = "androidx.compose.ui", name = "ui-tooling-preview" }
androidx-material3 = { group = "androidx.compose.material3", name = "material3" }
androidx-material-icons-extended = { group = "androidx.compose.material", name = "material-icons-extended" }

androidx-tv-foundation = { group = "androidx.tv", name = "tv-foundation", version.ref = "tvFoundation" }

androidx-navigation-compose = { group = "androidx.navigation", name = "navigation-compose", version.ref = "navigation" }
androidx-lifecycle-runtime-compose = { group = "androidx.lifecycle", name = "lifecycle-runtime-compose", version.ref = "lifecycle" }
androidx-datastore-preferences = { group = "androidx.datastore", name = "datastore-preferences", version.ref = "datastore" }

androidx-media3-exoplayer = { group = "androidx.media3", name = "media3-exoplayer", version.ref = "media3" }
androidx-media3-ui = { group = "androidx.media3", name = "media3-ui", version.ref = "media3" }
androidx-media3-ui-compose = { group = "androidx.media3", name = "media3-ui-compose", version.ref = "media3" }
# 缓存层显式声明（media3-exoplayer 只是**传递**依赖它；显式声明才能保证编译期可见
# DefaultDataSourceFactory/DefaultHttpDataSource 等 API 不被上游 POM 的依赖作用域变化打断）。版本必须与 media3 严格一致。
androidx-media3-datasource = { group = "androidx.media3", name = "media3-datasource", version.ref = "media3" }

# 第 4 层解码兜底：FFmpeg 软解（覆盖 ExoPlayer/系统都没有解码器的编码，如老设备上的 AV1、DTS/TrueHD 音轨）。
# AAR 自带 arm64-v8a / armeabi-v7a / x86 / x86_64 四套 libavcodec 等 .so，无需额外 jniLibs 配置。
nextlib-media3ext = { group = "io.github.anilbeesetti", name = "nextlib-media3ext", version.ref = "nextlib" }

retrofit = { group = "com.squareup.retrofit2", name = "retrofit", version.ref = "retrofit" }
retrofit-converter-gson = { group = "com.squareup.retrofit2", name = "converter-gson", version.ref = "retrofit" }
zxing-core = { group = "com.google.zxing", name = "core", version.ref = "zxing" }
okhttp = { group = "com.squareup.okhttp3", name = "okhttp", version.ref = "okhttp" }
okhttp-logging = { group = "com.squareup.okhttp3", name = "logging-interceptor", version.ref = "okhttp" }
coil-compose = { group = "io.coil-kt.coil3", name = "coil-compose", version.ref = "coil" }
coil-network-okhttp = { group = "io.coil-kt.coil3", name = "coil-network-okhttp", version.ref = "coil" }

hilt-android = { group = "com.google.dagger", name = "hilt-android", version.ref = "hilt" }
hilt-compiler = { group = "com.google.dagger", name = "hilt-compiler", version.ref = "hilt" }
hilt-navigation-compose = { group = "androidx.hilt", name = "hilt-navigation-compose", version.ref = "hiltNavigation" }

kotlinx-coroutines-android = { group = "org.jetbrains.kotlinx", name = "kotlinx-coroutines-android", version.ref = "coroutines" }

[plugins]
android-application = { id = "com.android.application", version.ref = "agp" }
kotlin-android = { id = "org.jetbrains.kotlin.android", version.ref = "kotlin" }
kotlin-compose = { id = "org.jetbrains.kotlin.plugin.compose", version.ref = "kotlin" }
ksp = { id = "com.google.devtools.ksp", version.ref = "ksp" }
hilt = { id = "com.google.dagger.hilt.android", version.ref = "hilt" }
